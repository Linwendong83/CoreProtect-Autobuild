name: Build CoreProtect

on:
  schedule:
    # GitHub cron uses UTC. This runs once per day.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: "CoreProtect branch to track"
        required: false
        default: "master"
      project_branch:
        description: "Value written to pom.xml <project.branch>"
        required: false
        default: "development"
      force_build:
        description: "Build even if this upstream commit already has a release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coreprotect-${{ github.event.inputs.upstream_branch || 'master' }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: PlayPro/CoreProtect
  UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'master' }}
  PROJECT_BRANCH: ${{ github.event.inputs.project_branch || 'development' }}
  FORCE_BUILD: ${{ github.event.inputs.force_build || 'false' }}
  RELEASE_TAG: latest

jobs:
  build:
    name: Build upstream commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Find latest upstream commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "refs/heads/${UPSTREAM_BRANCH}" | awk '{print $1}')"
          if [[ -z "$sha" ]]; then
            echo "Could not find ${UPSTREAM_REPO}@${UPSTREAM_BRANCH}" >&2
            exit 1
          fi

          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${UPSTREAM_REPO}/commit/${sha}" >> "$GITHUB_OUTPUT"

      - name: Fetch previous release info
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --json tagName,body,publishedAt > previous-release.json 2>/dev/null; then
            echo "found_release=true" >> "$GITHUB_OUTPUT"
            echo "Existing ${RELEASE_TAG} release found."
          else
            echo "found_release=false" >> "$GITHUB_OUTPUT"
            echo "{}" > previous-release.json
            echo "No existing ${RELEASE_TAG} release found."
          fi

      - name: Clone CoreProtect
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch "${UPSTREAM_BRANCH}" "https://github.com/${UPSTREAM_REPO}.git" coreprotect
          actual_sha="$(git -C coreprotect rev-parse HEAD)"
          if [[ "${actual_sha}" != "${{ steps.upstream.outputs.sha }}" ]]; then
            echo "Expected ${{ steps.upstream.outputs.sha }}, got ${actual_sha}" >&2
            exit 1
          fi

      - name: Check whether upstream changes need a build
        id: upstream_filter
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-upstream-build-needed.py \
            --coreprotect-dir coreprotect \
            --release-json previous-release.json \
            --current-sha "${{ steps.upstream.outputs.sha }}" \
            --force-build "${FORCE_BUILD}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Stop when upstream changes do not need a build
        if: steps.upstream_filter.outputs.should_build != 'true'
        shell: bash
        run: |
          echo "${{ steps.upstream_filter.outputs.reason }}"

      - name: Set up JDK 25
        if: steps.upstream_filter.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
          cache-dependency-path: coreprotect/pom.xml

      - name: Patch pom.xml project.branch
        if: steps.upstream_filter.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/set-project-branch.py coreprotect/pom.xml "${PROJECT_BRANCH}"
          grep -n "<project.branch>${PROJECT_BRANCH}</project.branch>" coreprotect/pom.xml

      - name: Build CoreProtect
        if: steps.upstream_filter.outputs.should_build == 'true'
        working-directory: coreprotect
        shell: bash
        run: mvn -B verify

      - name: Collect jars
        if: steps.upstream_filter.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-output
          find coreprotect/target -maxdepth 1 -type f -name "*.jar" \
            ! -name "original-*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -print0 | while IFS= read -r -d '' jar; do
              cp "$jar" build-output/
            done

          if ! compgen -G "build-output/*.jar" >/dev/null; then
            echo "No jar files were produced in coreprotect/target." >&2
            exit 1
          fi

          ls -lh build-output

      - name: Prepare release metadata
        if: steps.upstream_filter.outputs.should_build == 'true'
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("coreprotect/pom.xml").getroot()
          ns = ""
          if root.tag.startswith("{"):
              ns = root.tag[1:].split("}", 1)[0]

          def q(name):
              return f"{{{ns}}}{name}" if ns else name

          version = root.findtext(q("version"))
          if not version:
              parent = root.find(q("parent"))
              version = parent.findtext(q("version")) if parent is not None else ""

          if not version:
              raise SystemExit("Could not find project version in coreprotect/pom.xml")

          print(version.strip())
          PY
          )"
          echo "title=CoreProtect v${version}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        if: steps.upstream_filter.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coreprotect-${{ steps.upstream.outputs.short_sha }}
          path: build-output/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Generate release notes
        if: steps.upstream_filter.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-release-notes.py \
            --coreprotect-dir coreprotect \
            --release-json previous-release.json \
            --upstream-repo "${UPSTREAM_REPO}" \
            --upstream-branch "${UPSTREAM_BRANCH}" \
            --current-sha "${{ steps.upstream.outputs.sha }}" \
            --project-branch "${PROJECT_BRANCH}" \
            --output release-notes.md

          cat release-notes.md

      - name: Publish or update GitHub release
        if: steps.upstream_filter.outputs.should_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Updating existing release ${RELEASE_TAG}..."
            for asset in $(gh release view "${RELEASE_TAG}" --json assets -q '.assets[].name' 2>/dev/null || true); do
              if [[ -n "$asset" ]]; then
                echo "Removing old asset $asset"
                gh release delete-asset "${RELEASE_TAG}" "$asset" -y || true
              fi
            done
            gh release upload "${RELEASE_TAG}" build-output/*.jar --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "${{ steps.release.outputs.title }}" \
              --notes-file release-notes.md \
              --latest
          else
            echo "Creating release ${RELEASE_TAG}..."
            gh release create "${RELEASE_TAG}" build-output/*.jar \
              --title "${{ steps.release.outputs.title }}" \
              --notes-file release-notes.md \
              --latest \
              --target "${GITHUB_SHA}"
          fi
